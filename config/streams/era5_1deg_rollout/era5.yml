# Atmospheric stream, o96 daily mean. Joins the ERA5.1-corrected atmosphere with a
# 2 m temperature anchor handed to the model as a geoinfo channel: excluded from
# source and target, so it conditions the prediction without being predicted.
#
# The 'dataset' paths are site-specific -- adjust for your system.

ERA5 :
  type : anemoi
  stream_id : 0
  anemoi_config :
    join :
      - dataset : /e/data1/climateai/hclimrep/data/aimip_forcing/ERA5-o96-DAILYMEAN-atmos-1979-2024-era51.zarr
      - dataset : /e/data1/climateai/hclimrep/data/aimip_forcing/ERA5-o96-TRENDCLIM-1979-2014train-1979-2024.zarr
  frequency : 24h
  source_exclude : ['w_', 'tcw', 'cp', 'tp', '2t_clim', 'tcc', 'hcc', 'mcc', 'lcc', 'ssrd', 'strd', 'q_10', 't_10', 'u_10', 'v_10', 'w_10', 'z_10']
  target_exclude : ['w_', 'slor', 'sdor', 'tcw', 'cp', '2t_clim', 'tcc', 'hcc', 'mcc', 'lcc', 'ssrd', 'strd', 'q_10', 't_10', 'u_10', 'v_10', 'w_10', 'z_10']
  geoinfo_channels : ['2t_clim']
  masking_rate : 0.6
  masking_rate_none : 0.05
  loss_weight : 1.0
  location_weight : cosine_latitude
  token_size : 8
  tokenize_spacetime : True
  max_num_targets : 40320
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 512
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 512
  target_readout :
    type : 'obs_value'
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
